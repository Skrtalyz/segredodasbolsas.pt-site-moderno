    <script>
      // Safe wrapper to prevent "Converting circular structure to JSON" errors 
      // when third-party trackers, pixels, or dev tools serialize elements/events.
      (function() {
        var originalStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          var seen = new WeakSet();
          return originalStringify(value, function(key, val) {
            if (typeof val === "object" && val !== null) {
              if (seen.has(val)) {
                return "[Circular]";
              }
              seen.add(val);
              // Cleanly bypass serialized DOM nodes, events or React Fiber structures to avoid massive/circular trees
              if (val.nodeType || (val.constructor && (val.constructor.name.includes("Fiber") || val.constructor.name.includes("Element") || val.constructor.name.includes("Event")))) {
                return "[" + (val.constructor.name || "DOMElement") + "]";
              }
            }
            if (typeof replacer === "function") {
              return replacer(key, val);
            }
            return val;
          }, space);
        };
      })();
    </script>
